# FreeQrly — Cloudflare Pages config
name = "qrforge"
pages_build_output_dir = "."

# Opt into current Workers runtime behavior. REQUIRED for request.formData()
# to parse file uploads as File objects (formdata_parsing_supports_file);
# without this, Pages defaults to the oldest compat date and file parts
# come back as strings.
compatibility_date = "2026-10-16"

# Waffo Pancake billing (functions/_lib/waffo.js). "prod" since 2026-10-26
# go-live (products published from test, same IDs); secrets
# (WAFFO_MERCHANT_ID, WAFFO_PRIVATE_KEY_*, WAFFO_PRODUCT_*) are set
# as encrypted env vars in the Pages dashboard, never in this file.
[vars]
WAFFO_ENV = "prod"

[[d1_databases]]
binding = "DB"
database_name = "freeqrly"
database_id = "7c643833-dd76-4cb5-b528-0d6575b54362"

# Custom logos uploaded for dynamic QR codes (functions/api/logos.js).
# Served back via functions/api/logos/[key].js (capability URL, no auth).
[[r2_buckets]]
binding = "LOGOS"
bucket_name = "freeqrly-logos"
